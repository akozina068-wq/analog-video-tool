<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>analog</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 20px 60px;
    background: #1c1a17; color: #f2e8d8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    font-size: 20px; letter-spacing: 2px; text-transform: lowercase;
    color: #e8934a; margin: 8px 0 2px;
  }
  .sub { color: #8a8072; font-size: 13px; margin-bottom: 28px; }
  .card {
    width: 100%; max-width: 420px; background: #26231f; border-radius: 16px;
    padding: 20px; border: 1px solid #3a352e;
  }
  label { display: block; font-size: 13px; color: #b8ac97; margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #4a443a;
    background: #1c1a17; color: #f2e8d8; font-size: 16px;
  }
  .picker {
    display: flex; gap: 8px; margin-top: 6px;
  }
  .picker button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #4a443a; background: #1c1a17; color: #b8ac97; font-size: 14px; }
  .picker button.active { background: #e8934a; color: #1c1a17; border-color: #e8934a; font-weight: 600; }
  .preset-desc { font-size: 12px; color: #8a8072; margin-top: 6px; line-height: 1.4; }
  .upload-zone {
    margin-top: 20px; border: 2px dashed #4a443a; border-radius: 14px;
    padding: 30px 16px; text-align: center; color: #8a8072; font-size: 14px;
  }
  input[type=file] { display: none; }
  .pick-btn, .go-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; margin-top: 14px; cursor: pointer;
  }
  .pick-btn { background: #3a352e; color: #f2e8d8; }
  .go-btn { background: #e8934a; color: #1c1a17; }
  .go-btn:disabled { opacity: 0.4; }
  #filename { margin-top: 10px; font-size: 13px; color: #e8934a; word-break: break-all; }
  #status { margin-top: 18px; font-size: 14px; color: #b8ac97; text-align: center; min-height: 20px; }
  .result { margin-top: 16px; text-align: center; }
  .result video { width: 100%; border-radius: 12px; }
  .dl-btn {
    display: block; margin-top: 12px; padding: 14px; background: #e8934a;
    color: #1c1a17; text-decoration: none; border-radius: 12px; font-weight: 600;
  }
  .spinner {
    border: 3px solid #3a352e; border-top: 3px solid #e8934a; border-radius: 50%;
    width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 10px auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>analog</h1>
  <div class="sub">grain · warm fade · timestamp</div>

  <div class="card">
    <label>timestamp text</label>
    <input type="text" id="stamp" maxlength="20" placeholder="08 19 26">

    <label>preset</label>
    <div class="picker" id="presetPicker">
      <button type="button" class="active" data-val="crt">crt</button>
      <button type="button" data-val="hero">hero</button>
      <button type="button" data-val="diary">diary</button>
    </div>
    <div class="preset-desc" id="presetDesc">signal breaking through — glitch, scan lines, cool tint</div>

    <label>timestamp text</label>
    <input type="text" id="stamp" maxlength="24" placeholder="08 19 26">

    <label id="captionLabel" style="display:none">caption (shows on video instead of timestamp)</label>
    <input type="text" id="caption" maxlength="60" placeholder="you are not lazy" style="display:none">

    <label>resolution</label>
    <div class="picker" id="resPicker">
      <button type="button" data-val="720">720p</button>
      <button type="button" class="active" data-val="1080">1080p</button>
      <button type="button" data-val="4k">4K</button>
    </div>
    <div class="preset-desc" id="resWarning" style="display:none">4K needs more server memory than the free tier — use if you've upgraded, otherwise stick to 1080p</div>

    <div class="upload-zone" id="dropText">tap below to choose a video</div>
    <input type="file" id="fileInput" accept="video/*">
    <button class="pick-btn" id="pickBtn">choose video</button>
    <div id="filename"></div>

    <button class="go-btn" id="goBtn" disabled>process</button>

    <div id="status"></div>
    <div class="result" id="result"></div>
  </div>

<script>
  const fileInput = document.getElementById('fileInput');
  const pickBtn = document.getElementById('pickBtn');
  const goBtn = document.getElementById('goBtn');
  const filenameEl = document.getElementById('filename');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const stampInput = document.getElementById('stamp');
  const pickerBtns = document.querySelectorAll('#presetPicker button, #resPicker button');
  const presetBtns = document.querySelectorAll('#presetPicker button');
  const resBtns = document.querySelectorAll('#resPicker button');
  const presetDesc = document.getElementById('presetDesc');
  const resWarning = document.getElementById('resWarning');
  const captionLabel = document.getElementById('captionLabel');
  const captionInput = document.getElementById('caption');

  const descriptions = {
    crt: 'signal breaking through — glitch, scan lines, cool tint',
    hero: 'clean and isolated — warm, sharp, one subject',
    diary: 'quiet and intimate — heavy grain, warm fade, caption in frame'
  };

  let preset = 'crt';
  let resolution = '1080';
  let chosenFile = null;

  presetBtns.forEach(b => b.addEventListener('click', () => {
    presetBtns.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    preset = b.dataset.val;
    presetDesc.textContent = descriptions[preset];
    const isDiary = preset === 'diary';
    captionLabel.style.display = isDiary ? 'block' : 'none';
    captionInput.style.display = isDiary ? 'block' : 'none';
  }));

  resBtns.forEach(b => b.addEventListener('click', () => {
    resBtns.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    resolution = b.dataset.val;
    resWarning.style.display = resolution === '4k' ? 'block' : 'none';
  }));

  pickBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      chosenFile = fileInput.files[0];
      filenameEl.textContent = chosenFile.name;
      goBtn.disabled = false;
    }
  });

  goBtn.addEventListener('click', async () => {
    if (!chosenFile) return;
    goBtn.disabled = true;
    resultEl.innerHTML = '';
    statusEl.innerHTML = 'uploading...<div class="spinner"></div>';

    const form = new FormData();
    form.append('video', chosenFile);
    form.append('stamp', stampInput.value);
    form.append('caption', captionInput.value);
    form.append('preset', preset);
    form.append('resolution', resolution);

    try {
      const res = await fetch('/process', { method: 'POST', body: form });
      const data = await res.json();
      if (!data.jobId) throw new Error('upload failed');
      statusEl.innerHTML = 'processing...<div class="spinner"></div>';
      poll(data.jobId);
    } catch (e) {
      statusEl.textContent = 'something went wrong, try again';
      goBtn.disabled = false;
    }
  });

  async function poll(jobId, attempt = 0) {
    const res = await fetch('/status/' + jobId);
    const data = await res.json();
    if (data.status === 'done') {
      statusEl.textContent = 'done';
      resultEl.innerHTML = `
        <video src="${data.url}" controls playsinline></video>
        <a class="dl-btn" href="${data.url}" download>download</a>
      `;
      goBtn.disabled = false;
    } else if (data.status === 'error') {
      statusEl.textContent = data.reason === 'lost'
        ? 'server ran out of memory and restarted - try a lower resolution (1080p is safest)'
        : 'processing failed, try again';
      goBtn.disabled = false;
    } else if (attempt > 150) {
      // ~5 minutes of polling with no result - stop waiting instead of
      // spinning forever
      statusEl.textContent = 'this is taking too long - likely crashed. try 1080p instead of 4K';
      goBtn.disabled = false;
    } else {
      setTimeout(() => poll(jobId, attempt + 1), 2000);
    }
  }
</script>
</body>
</html>
